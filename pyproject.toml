[tool.poetry]
name = "preprocessing"
version = "0.2.0"
description = ""
authors = ["DARP <daarojaspa@unal.edu.co>"]
readme = "README.md"
[tool.poetry.dependencies]
python = ">=3.9,<3.12"

# Core dependencies
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"

# Topic modeling
bertopic = "0.16.4"
sentence-transformers = "2.7.0"

# Explicit versions to avoid conflicts
torch = "2.2.2"
transformers = "4.39.3"
umap-learn = "0.5.6"

# Optional: for visualizations if you plan to use BERTopic's interactive plots
plotly = "^5.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.1.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

